services:
  app:
    build: .
    image: payload-upgrader
    environment:
      APP_DB_PATH: /data/app.db
    volumes:
      - app-data:/data
    ports:
      # 宿主机端口可配置：APP_PORT=9000 docker compose up app
      - "${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  verify:
    build: .
    image: payload-upgrader
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_BASE_URL: http://app:8000
    command: ["python", "-m", "verify.acceptance"]

volumes:
  app-data:
